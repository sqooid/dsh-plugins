- insert:
    - id: hindsight-memory
      name: '@local/dsh-hindsight-memory'
      config:
        # Hindsight data-plane API. The Control Plane UI (localhost:9999)
        # reports this URL at /api/health as its "dataplane".
        baseUrl: http://localhost:8888
        bankId: omp
        # Retain each completed top-level turn (user prompt + final answer).
        autoRetain: true
        retainSubagents: false
        retainContext: dsh
        recallBudget: mid
        recallMaxTokens: 4096
        timeoutMs: 120000
